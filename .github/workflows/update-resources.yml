name: Update resources index

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate content indexes and resources
        run: |
          python scripts/manage_content_catalog.py --write
          python scripts/generate_resources.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add BACKLOG.md docs projects resources data/resources.json sitemap.xml || true
          git commit -m "chore: update resources index" || echo "no changes"
          git push || echo "skip push"
