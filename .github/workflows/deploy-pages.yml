name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/ai-research-ebook/package-lock.json
            apps/InterviewGuide/package-lock.json

      - name: Check tracked content indexes
        run: python scripts/manage_content_catalog.py --check

      - name: Generate resources and sitemap
        run: python scripts/generate_resources.py

      - name: Install dependencies for research site
        working-directory: apps/ai-research-ebook
        run: npm ci

      - name: Install dependencies for InterviewGuide
        working-directory: apps/InterviewGuide
        run: npm ci

      - name: Build research site
        working-directory: apps/ai-research-ebook
        env:
          SITE_URL: https://adongwanai.github.io
          BASE_PATH: /AgentGuide/research
          GITHUB_USERNAME: adongwanai
          GITHUB_REPO: AgentGuide
          GITHUB_REPOSITORY_URL: https://github.com/adongwanai/AgentGuide
        run: npm run build

      - name: Build InterviewGuide
        working-directory: apps/InterviewGuide
        env:
          SITE_URL: https://adongwanai.github.io
          BASE_PATH: /AgentGuide/interview
          GITHUB_USERNAME: adongwanai
          GITHUB_REPO: AgentGuide
          GITHUB_REPOSITORY: adongwanai/AgentGuide
        run: npm run build

      - name: Assemble deployment artifact
        run: |
          mkdir -p site-dist/assets site-dist/data site-dist/research site-dist/interview
          cp index.html 404.html robots.txt site.webmanifest .nojekyll site-dist/
          cp -r assets/. site-dist/assets/
          cp data/resources.json site-dist/data/resources.json
          cp sitemap.xml site-dist/sitemap.xml
          cp -r apps/ai-research-ebook/dist/. site-dist/research/
          cp -r apps/InterviewGuide/dist/. site-dist/interview/

      - name: Smoke-test deployment artifact
        run: python tests/pages_assembly.test.py site-dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
